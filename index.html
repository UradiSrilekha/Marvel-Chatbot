<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marvel - Voice Chatbot</title>
  
  <!-- Free Keyless AI Model Engine (Puter.js) -->
  <script src="https://js.puter.com/v2/"></script>
  
  <style>
    body { 
      font-family: Arial, sans-serif; 
      background: #111; 
      color: #fff; 
      text-align: center; 
      margin-top: 50px; 
    }
    #status { 
      color: #888; 
      font-style: italic; 
      margin-bottom: 20px; 
    }
    #chat-box { 
      max-width: 500px; 
      margin: 0 auto; 
      text-align: left; 
      background: #222; 
      padding: 20px; 
      border-radius: 8px; 
      min-height: 200px; 
      max-height: 400px;
      overflow-y: auto;
    }
    .user { 
      color: #4da6ff; 
      margin-bottom: 10px; 
    }
    .marvel { 
      color: #ff4d4d; 
      margin-bottom: 10px; 
    }
    button { 
      padding: 12px 24px; 
      font-size: 16px; 
      cursor: pointer; 
      border: none; 
      border-radius: 4px; 
      background: #ff4d4d; 
      color: white; 
      font-weight: bold; 
    }
  </style>
</head>
<body>

  <h1>Marvel AI</h1>
  <div id="status">Click "Start Marvel" to speak.</div>
  
  <button id="toggle-btn" onclick="toggleListening()">Start Marvel</button>

  <div id="chat-box" style="margin-top: 20px;"></div>

  <script>
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    let recognition = null;
    let isListening = false;
    let currentAudio = null;

    const statusEl = document.getElementById("status");
    const chatBox = document.getElementById("chat-box");
    const toggleBtn = document.getElementById("toggle-btn");

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = "en-US";

      recognition.onstart = () => {
        isListening = true;
        statusEl.innerText = "Marvel is listening...";
        toggleBtn.innerText = "Stop Marvel";
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        appendMessage("You", transcript, "user");
        processUserInput(transcript);
      };

      recognition.onerror = (event) => {
        console.error("Speech Recognition Error:", event.error);
        statusEl.innerText = `Error: ${event.error}`;
        isListening = false;
        toggleBtn.innerText = "Start Marvel";
      };

      recognition.onend = () => {
        isListening = false;
      };
    } else {
      alert("Speech recognition is not supported in this browser. Please use Google Chrome, Microsoft Edge, or Safari.");
    }

    function toggleListening() {
      if (!recognition) return;
      
      if (isListening) {
        recognition.stop();
        statusEl.innerText = "Stopped listening.";
        toggleBtn.innerText = "Start Marvel";
      } else {
        try {
          recognition.start();
        } catch (e) {
          console.warn("Recognition already active", e);
        }
      }
    }

    async function processUserInput(text) {
      statusEl.innerText = "Marvel is thinking...";
      toggleBtn.innerText = "Thinking...";

      try {
        // Send speech input to the AI model
        const systemPrompt = "You are Marvel, a helpful and concise AI assistant. Keep responses under 2-3 short sentences so they sound natural when spoken out loud.";
        const response = await puter.ai.chat(`${systemPrompt}\nUser says: ${text}`);
        
        const replyText = response.toString().trim();

        appendMessage("Marvel", replyText, "marvel");
        speak(replyText);
      } catch (error) {
        console.error("AI Error:", error);
        const fallbackText = "Sorry, I had trouble thinking of an answer. Please try asking again.";
        appendMessage("Marvel", fallbackText, "marvel");
        speak(fallbackText);
      }
    }

    function appendMessage(sender, text, className) {
      const p = document.createElement("p");
      p.className = className;
      p.innerHTML = `<strong>${sender}:</strong> ${text}`;
      chatBox.appendChild(p);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function speak(text) {
      statusEl.innerText = "Marvel is speaking...";
      toggleBtn.innerText = "Speaking...";

      if (currentAudio) {
        currentAudio.pause();
      }

      const encodedText = encodeURIComponent(text);
      const audioUrl = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodedText}&tl=en&client=tw-ob`;
      
      currentAudio = new Audio(audioUrl);

      currentAudio.play().then(() => {
        currentAudio.onended = resetControls;
      }).catch((err) => {
        console.warn("Online TTS Stream blocked. Switching to Web Speech API fallback...", err);
        fallbackToNativeTTS(text);
      });
    }

    function fallbackToNativeTTS(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 1.0;
        utterance.pitch = 1.0;
        
        utterance.onend = resetControls;
        utterance.onerror = resetControls;

        window.speechSynthesis.speak(utterance);
      } else {
        resetControls();
      }
    }

    function resetControls() {
      statusEl.innerText = "Click button to speak again.";
      toggleBtn.innerText = "Start Marvel";
    }
  </script>
</body>
</html>
